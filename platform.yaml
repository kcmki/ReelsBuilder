name: reels-dashboard
enabled: true

deployment:
  auto_deploy: true
  branches:
    - main

build:
  strategy: compose
  compose_file: docker-compose.yml
  service: reels-dashboard   # only this service gets Traefik routing; reelsbuilder runs alongside

runtime:
  internal_port: 8000
  healthcheck: /health
  restart_policy: unless-stopped

routing:
  domain: reels.mekki.tech

environment:
  # dashboard
  - SESSION_SECRET
  # instagram / meta graph api (reelsbuilder)
  - APP_ID
  - APP_SECRET
  - USER_TOKEN
  - FB_PAGE_ID
  - INSTAGRAM_BUISINESS_ACCOUNT
  - LONG_TIME_ACCESS_TOKEN
  # supabase s3 (optional — only if SupabaseS3Handler is used)
  - endpoint
  - key_id
  - secret_key
  - SUPABASE_REGION
  - SUPABASE_PUBLIC_BASE

labels:
  type: backend
  language: python
  team: personal
