; Global settings. Per-account options (schedule, queries, caption, edit style)
; live in the Accounts page of the dashboard.

[scheduler]
; cron (minute hour day month weekday) for replying to comments/DMs on every account
interactions_cron = */30 * * * *

[search]
; first search size per query; doubled up to max_limit until an unused video turns up
limit = 5
max_limit = 100
; relevance, upload_date, view_count or rating
sort_by = relevance

[cleanup]
cleanup_cron = 0 0 * * *
; unpublished reels older than this are deleted
keep_days = 2
