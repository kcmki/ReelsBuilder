[scheduler]
# cron expressions in standard 5-field format (minute hour day month weekday)
# run search at 8am,10am,12pm,2pm,4pm,6pm,8pm,10pm
search_cron = 0 * * * *
#0 8,10,12,14,16,18,20,22 * * *
interactions_cron = */30 * * * *

[search]
# multiple queries separated by `||`
queries = Supercars on the road || Exotic cars in the city || Luxury cars in action || Sports cars on track
limit = 1
max_limit = 100
# can be relevance, upload_date, view_count or rating (default is relevant)
sort_by = relevance

[clips]
min_duration = 20
clips_count = 10

[interactions]
reply_message = Thanks for interacting with us! Make sure to follow for more content! 

[instagram]
# default caption/description for uploaded reels; supports {video_id} and {title}
reels_caption = Built for the road, driven by passion. Every rev tells a story. 💨🏁 #cars #carsofinstagram #carlovers #carreels #auto #automotive #carlife #carswithoutlimits #dreamcars #luxurycars #sportscars #engine #reels #instareels #explorepage

[cleanup]
# cron expression for cleanup job (runs every 3 days at midnight by default)
cleanup_cron = 0 0 */1 * *
# how many days of clips to keep (older clips will be deleted)
keep_days = 2
